<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="petalGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF9EBE" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </radialGradient>
    <radialGradient id="centerCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g transform="translate(16, 16)" filter="url(#shadow)">
    <!-- 8 Elegant Blossom Petals -->
    <path d="M 0 -2 C -5.5 -8, -5.5 -14.5, 0 -14.5 C 5.5 -14.5, 5.5 -8, 0 -2" fill="url(#petalGlow)"/>
    <path d="M 0 -2 C -5.5 -8, -5.5 -14.5, 0 -14.5 C 5.5 -14.5, 5.5 -8, 0 -2" fill="url(#petalGlow)" transform="rotate(45)"/>
    <path d="M 0 -2 C -5.5 -8, -5.5 -14.5, 0 -14.5 C 5.5 -14.5, 5.5 -8, 0 -2" fill="url(#petalGlow)" transform="rotate(90)"/>
    <path d="M 0 -2 C -5.5 -8, -5.5 -14.5, 0 -14.5 C 5.5 -14.5, 5.5 -8, 0 -2" fill="url(#petalGlow)" transform="rotate(135)"/>
    <path d="M 0 -2 C -5.5 -8, -5.5 -14.5, 0 -14.5 C 5.5 -14.5, 5.5 -8, 0 -2" fill="url(#petalGlow)" transform="rotate(180)"/>
    <path d="M 0 -2 C -5.5 -8, -5.5 -14.5, 0 -14.5 C 5.5 -14.5, 5.5 -8, 0 -2" fill="url(#petalGlow)" transform="rotate(225)"/>
    <path d="M 0 -2 C -5.5 -8, -5.5 -14.5, 0 -14.5 C 5.5 -14.5, 5.5 -8, 0 -2" fill="url(#petalGlow)" transform="rotate(270)"/>
    <path d="M 0 -2 C -5.5 -8, -5.5 -14.5, 0 -14.5 C 5.5 -14.5, 5.5 -8, 0 -2" fill="url(#petalGlow)" transform="rotate(315)"/>
    
    <!-- Flower Center with warm golden pistil -->
    <circle cx="0" cy="0" r="4.2" fill="url(#centerCore)" stroke="#FFFBEB" stroke-width="0.75"/>
    <circle cx="-1" cy="-1" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
